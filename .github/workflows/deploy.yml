name: Deploy web build to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GODOT: Godot_v4.7-stable_linux.x86_64
      TPZ: Godot_v4.7-stable_export_templates.tpz
      BASE: https://github.com/godotengine/godot/releases/download/4.7-stable
    steps:
      - uses: actions/checkout@v4

      - name: Install Godot 4.7 + web export templates
        run: |
          wget -qO godot.zip "$BASE/$GODOT.zip"
          wget -qO templates.tpz "$BASE/$TPZ"
          unzip -q godot.zip
          chmod +x "$GODOT"
          mkdir -p "$HOME/.local/share/godot/export_templates/4.7.stable"
          unzip -q templates.tpz
          mv templates/* "$HOME/.local/share/godot/export_templates/4.7.stable/"

      - name: Export Web build
        run: |
          mkdir -p build/web
          # Import resources first so the export has a populated cache.
          ./"$GODOT" --headless --path . --import || true
          ./"$GODOT" --headless --path . --export-release "Web" build/web/index.html
          test -f build/web/index.html
          touch build/web/.nojekyll
          ls -la build/web

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
